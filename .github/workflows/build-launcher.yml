name: Build launcher
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "tag or branch to build"
        default: "main"
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Show SDK
        run: ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"
      - name: Build
        working-directory: launcher
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: tvhome-apk
          path: launcher/app/build/outputs/apk/release/app-release.apk
